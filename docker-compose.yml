services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: schematic-pg-postgres:18-cron
    container_name: schematic-pg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgrest
      POSTGRES_PASSWORD: postgrest
      POSTGRES_DB: postgrest
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=postgrest
    volumes:
      - ./docker_data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgrest -d postgrest"]
      interval: 5s
      timeout: 5s
      retries: 5
